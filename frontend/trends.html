<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoSocial Trends</title>
    <link rel="stylesheet" href="trends.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<div class="dashboard-layout">

<!-- Sidebar -->

<aside class="sidebar">
<h2 class="logo">EchoSocial AI</h2>
<ul class="sidebar-menu">

<li onclick="window.location.href='dashboard.html'">
    <i class="fa-solid fa-house"></i>
    Dashboard
</li>


<li onclick="window.location.href='trends.html'">
    <i class="fa-solid fa-arrow-trend-up"></i>
    Trends
</li>


<li onclick="window.location.href='content-ideas.html'">
    <i class="fa-solid fa-lightbulb"></i>
    Content Ideas
</li>


<li onclick="window.location.href='image-studio.html'">
    <i class="fa-solid fa-image"></i>
    Image Studio
</li>

<li onclick="window.location.href='schedule.html'">
    <i class="fa-solid fa-calendar-days"></i>
    Schedule
</li>

<li onclick="window.location.href='marketing.html'">
    <i class="fa-solid fa-chart-line"></i>
    Marketing Strategy
</li>


<li onclick="window.location.href='analytics.html'">
    <i class="fa-solid fa-chart-column"></i>
    Analytics
</li>


<li onclick="window.location.href='settings.html'">
    <i class="fa-solid fa-gear"></i>
    Settings
</li>

</ul>

<div class="sidebar-user">
<i class="fa-solid fa-user"></i>
<div>

<strong>Demo User</strong>
<small>demo@echosocial.ai</small>
</div>
</div>
</aside>

<!-- Main -->

<main class="main-content">
<header class="topbar">
    <div class="top-left">
    </div>

    <div class="top-right">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
                type="text"
                placeholder="Search features...">
        </div>

        <i class="fa-regular fa-bell notification"></i>
        <i class="fa-solid fa-user-circle profile-icon"></i>
    </div>

</header>

<!-- Trending News -->

<section class="trend-section">
    <div class="trend-header">
       <h2>🤖 Trending AI News</h2>
        <a href="#" id="refreshNews">Refresh</a>
    </div>

    <div id="news-list">
    </div>
</section>
</main>
</div>

<script src="trends.js"></script>
<script src="theme.js"></script>
</body>
</html>
